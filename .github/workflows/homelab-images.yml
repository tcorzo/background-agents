# Homelab-only: builds the two container images the homelab deployment runs
# (tcorzo/selfhosted services/open-inspect) and pushes them to GHCR.
#
#   ghcr.io/tcorzo/open-inspect-control-plane  packages/control-plane/Dockerfile (upstream's)
#   ghcr.io/tcorzo/open-inspect-web            packages/web/Dockerfile (homelab-only)
#
# Every push to `homelab` publishes both as `sha-<full commit sha>`; the
# homelab compose file pins that tag. `homelab` also moves, for humans only.
#
# The web image inlines NEXT_PUBLIC_* at build time, so it is built for one
# control-plane hostname (env below). None of these values is secret.
name: homelab-images

on:
  push:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: tcorzo
  WEB_WS_URL: wss://inspect-api.tcorzo.dev
  WEB_SANDBOX_PROVIDER: daytona
  WEB_SCM_PROVIDER: github

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: open-inspect-control-plane
            dockerfile: packages/control-plane/Dockerfile
          - image: open-inspect-web
            dockerfile: packages/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_WS_URL=${{ env.WEB_WS_URL }}
            NEXT_PUBLIC_SANDBOX_PROVIDER=${{ env.WEB_SANDBOX_PROVIDER }}
            NEXT_PUBLIC_SCM_PROVIDER=${{ env.WEB_SCM_PROVIDER }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:homelab
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
